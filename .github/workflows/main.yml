name: Pipeline Aufgabe

on:
 push:
  branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
            distribution: temurin
            java-version: '25'
      - run: java --version
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  build:
    runs-on: ubuntu-latest
    needs: test
    script:
      - git status
      - mvn clean package





